# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: community-market
      name: dsh-community-market
    - id: files-toolkit
      name: dsh-files
      config:
        maxFileBytes: 25165824
        readLimit: 2000
        sheetRowLimit: 200
        maxSheets: 5
        cacheEntries: 16
        cacheMaxBytes: 67108864
        maxOutputChars: 24000
        readTimeoutMs: 120000
        uploadMaxBytes: 25165824
        allowedExtensions: []
        uploadTtlMs: 604800000
        sweepIntervalMs: 3600000
        maxConcurrentUploads: 4
        maxUploadBytesPerSession: 0
        trustedHosts: []
    - id: ezai-auth
      name: dsh-ezai-auth
      config:
        baseURL: 'https://www.ezsvsbox.com'
        loginPath: '/login'
        captchaPath: '/captcha/box'
        tokenQuota: 200000000
    # The tray terminal command is hidden while the terminal remains available
    # through plugin recovery and the active profile.
    # - id: desktop-terminal
    #   name: dsh-plugin-desktop/terminal
    #   disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Disable upstream official branding so all platforms (Windows & macOS) consistently display Jinshi Yifu
- id: ui-brand-official
  disabled: true
